name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: .NET 8 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Orch8.Sdk.sln
      - name: Build
        run: dotnet build Orch8.Sdk.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Orch8.Sdk.Tests -c Release --no-build
      - name: Pack (smoke)
        run: dotnet pack Orch8.Sdk.sln -c Release --no-build -o artifacts
