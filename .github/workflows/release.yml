name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Pack, GitHub Release, NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Check tag matches package version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Directory.Build.props version ${version}"
            exit 1
          fi
      - name: Test
        run: dotnet test tests/Orch8.Sdk.Tests -c Release
      - name: Pack
        run: |
          dotnet pack Orch8.Sdk.sln -c Release -o dist \
            -p:ContinuousIntegrationBuild=true \
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
      - name: Publish to NuGet (skipped without NUGET_API_KEY)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::notice::NUGET_API_KEY not configured; skipping NuGet publish."
            exit 0
          fi
          # Pushing a .nupkg also pushes the matching .snupkg next to it.
          dotnet nuget push "dist/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
